# M4: healthy adult blood from six Census datasets (different labs and 10x chemistries).
name: m4_blood

census:
  version: "2025-01-30"
  uri: "s3://cellxgene-census-public-us-west-2/cell-census/2025-01-30/soma/"
  region: "us-west-2"
  organism: "Homo sapiens"
  # Single cells (not nuclei) from healthy donors, each cell counted once across Census.
  obs_filter: "disease == 'normal' and is_primary_data == True and suspension_type == 'cell'"

datasets:
  - {name: schulte, dataset_id: "5e717147-0f75-4de1-8bd2-6fda01b8d75f"}   # 10x 3' v2 and v3
  - {name: hao, dataset_id: "ed5d841d-6346-47d4-ab2f-7119ad7e3a35"}       # 10x 3' v3
  - {name: stephenson, dataset_id: "c7775e88-49bf-4ba2-a03b-93f00447c958"} # 10x 3'
  - {name: combat, dataset_id: "ebc2e1ff-c8f9-466a-acf4-9d291afaf8b3"}    # 10x 5' v1
  - {name: aida, dataset_id: "b0e547f0-462b-4f81-b31b-5b0a5d96f537", max_donors: 30}    # 10x 5' v2
  - {name: onek1k, dataset_id: "3faad104-2ab8-4434-816d-474d8d2641db", max_donors: 30}  # 10x 3' v2

max_cells_per_donor: 500
min_cells_per_donor: 200
seed: 0

qc:
  min_counts: 500
  min_genes: 200
  max_pct_mt: 15.0
  min_cells_per_type: 50      # per lineage, counted over all datasets
  min_cells_per_gene: 10

normalize:
  target_sum: 10000

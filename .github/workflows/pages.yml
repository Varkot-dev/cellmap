name: pages

# Publishes site/ (the explainer and the atlas) to GitHub Pages. Run by hand from the Actions
# tab after Pages is switched on (Settings > Pages > Source: GitHub Actions). It does not run on
# push, so it cannot fail while the repository is private or Pages is off.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

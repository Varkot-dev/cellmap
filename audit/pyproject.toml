[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakaudit"
version = "0.1.0"
description = "Leakage and shortcut audit kit for machine learning on biological data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
# Only needed to pass an AnnData object as X; the kit never imports anndata itself.
anndata = ["anndata>=0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/leakaudit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["leakaudit"]
